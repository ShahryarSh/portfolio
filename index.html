<!-- The HTML5 doctype declaration informs the browser of the document type -->
<!DOCTYPE HTML>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Personal Portfolio</title>
  
  <!-- Full-size desktop/laptop stylesheet (960px or wider) -->
  <link rel="stylesheet" type="text/css" href="full.css" media="only screen and (min-width: 960px)">
  
  <!-- Tablet stylesheet (between 481px and 960px) -->
  <link rel="stylesheet" type="text/css" href="tablet.css" media="only screen and (min-width: 481px) and (max-width: 960px)">
  
  <!-- Mobile phone stylesheet (480px or narrower) -->
  <link rel="stylesheet" type="text/css" href="phone.css" media="only screen and (max-width: 480px)">
</head>
<body>

          <li><a href="projects.html">Projects</a></li>

    </article>

    <!-- Clear class terminates float inheritance before the footer -->
    <div class="clear"></div>

    <footer>
      <p>&copy; 2026 Shahryar Shahid. All Rights Reserved.</p>
      <address>
        <p>Contact: <a href="mailto:shahryar.shahid@ontariotechu.net">shahryar.shahid@ontariotechu.net</a></p>
      </address>

</html>
